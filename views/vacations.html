<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vacations</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="../styles/vacations.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <main class="shell">
    <section class="editor">
      <div class="editor-heading">
        <h1>My Vacations</h1>
      </div>

      <form id="vacation-form" class="range-form">
        <label>
          <span>Start</span>
          <input id="start-date" type="date" required>
        </label>
        <label>
          <span>End</span>
          <input id="end-date" type="date" required>
        </label>
        <button type="submit">Add</button>
      </form>

      <div id="my-ranges" class="my-ranges"></div>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="timeline-section">
      <div class="section-heading">
        <h2>Team Schedule</h2>
        <div class="schedule-status">
          <div class="active-count" aria-label="Active vacations">
            <img src="../images/icon.png" alt="">
            <span id="active-count" class="active-count-number">0</span>
            <span id="schedule-active-count" class="schedule-active-count">members on vacation today</span>
          </div>
          <button id="history-button" class="history-button" type="button">Full History</button>
        </div>
      </div>
      <div class="timeline-scroll">
        <div id="timeline" class="timeline"></div>
      </div>
    </section>
  </main>

  <div id="history-panel" class="history-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <section class="history-panel">
      <div class="history-heading">
        <h2 id="history-title">Full History</h2>
        <button id="history-close-button" class="remove-button history-close-button" type="button" aria-label="Close history">×</button>
      </div>
      <div id="history-content" class="history-content"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="../js/views/vacations.js"></script>
</body>
</html>
