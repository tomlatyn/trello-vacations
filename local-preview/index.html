<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vacations Power-Up Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f2f4;
      color: #172b4d;
    }

    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 10px 18px;
      background: #0c66e4;
      color: #ffffff;
    }

    .board-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .board-title h1,
    .board-title p {
      margin: 0;
    }

    .board-title h1 {
      font-size: 18px;
    }

    .board-title p {
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
    }

    .board-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .powerup-button,
    .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      border: 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .2);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    .powerup-button {
      min-width: 54px;
      padding: 6px 10px;
    }

    .text-button {
      padding: 6px 12px;
    }

    .powerup-button:hover,
    .text-button:hover {
      background: rgba(255, 255, 255, .3);
    }

    .powerup-button img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    main {
      width: min(1040px, calc(100vw - 32px));
      margin: 24px auto;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #dfe1e6;
      border-radius: 8px;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .panel p {
      margin: 0 0 12px;
      color: #626f86;
      font-size: 13px;
    }

    .member-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .member-switcher button {
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      background: #ffffff;
      color: #172b4d;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .member-switcher button:hover {
      background: #f7f8f9;
    }

    .preview-frame {
      width: 100%;
      height: 640px;
      border: 1px solid #dfe1e6;
      border-radius: 8px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header class="board-header">
    <div class="board-title">
      <h1>Team Board</h1>
      <p>Local preview with seeded vacation data</p>
    </div>
    <div class="board-actions">
      <button id="vacation-button" class="powerup-button" type="button">Loading</button>
      <button class="text-button" type="button" onclick="TrelloMock.reset()">Reset data</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Preview Controls</h2>
      <p>Switch the mocked logged-in member, then use the embedded vacation board bar below.</p>
      <div id="member-switcher" class="member-switcher"></div>
    </section>

    <iframe class="preview-frame" src="vacations.html" title="Vacations board bar preview"></iframe>
  </main>

  <script src="trello-mock.js"></script>
  <script src="../js/features/board-buttons.js"></script>
  <script>
    function renderMemberSwitcher() {
      var currentId = localStorage.getItem('trello_vacations_preview__memberId') || 'user123';
      var wrapper = document.getElementById('member-switcher');
      wrapper.innerHTML = TrelloMock.members.map(function(member) {
        var label = member.fullName + (member.id === currentId ? ' (current)' : '');
        return '<button type="button" onclick="TrelloMock.setCurrentMember(\'' + member.id + '\')">' + label + '</button>';
      }).join('');
    }

    function renderBoardButton() {
      var t = TrelloMock.createMockT();
      boardButtonsHandler(t).then(function(buttons) {
        var config = buttons[0];
        var button = document.getElementById('vacation-button');
        button.innerHTML = '<img src="' + config.icon.light + '" alt=""> <span>' + config.text + '</span>';
        button.onclick = function() {
          window.location.href = 'vacations.html';
        };
      });
    }

    renderMemberSwitcher();
    renderBoardButton();
  </script>
</body>
</html>
